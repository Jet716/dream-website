<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Welcome to Dream</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      height:100vh;
      overflow:hidden;
      display:flex;
      justify-content:center;
      align-items:center;
      font-family:Arial, sans-serif;
      position:relative;
      color:white;
    }

    /* Background Image */
    body::before{
      content:"";
      position:absolute;
      inset:0;
      background:url('dream.jpg') no-repeat center center/cover;
      animation:zoomEffect 20s infinite alternate ease-in-out;
      z-index:-2;
    }

    /* Dark Overlay */
    body::after{
      content:"";
      position:absolute;
      inset:0;
      background:rgba(0,0,0,0.45);
      z-index:-1;
    }

    @keyframes zoomEffect{
      from{
        transform:scale(1);
      }
      to{
        transform:scale(1.1);
      }
    }

    .container{
      text-align:center;
      padding:40px;
      background:rgba(255,255,255,0.08);
      backdrop-filter:blur(10px);
      border:1px solid rgba(255,255,255,0.2);
      border-radius:20px;
      box-shadow:0 8px 32px rgba(0,0,0,0.4);
      animation:fadeIn 2s ease;
      max-width:700px;
    }

    h1{
      font-size:4rem;
      margin-bottom:15px;
      text-shadow:2px 2px 12px black;
      animation:floatText 3s ease-in-out infinite;
    }

    p{
      font-size:1.3rem;
      margin-bottom:30px;
      color:#f1f1f1;
      line-height:1.6;
    }

    .btn{
      display:inline-block;
      padding:14px 32px;
      background:white;
      color:black;
      text-decoration:none;
      border-radius:50px;
      font-weight:bold;
      transition:0.3s ease;
    }

    .btn:hover{
      transform:scale(1.08);
      background:#f0f0f0;
      box-shadow:0 0 20px rgba(255,255,255,0.7);
    }

    @keyframes fadeIn{
      from{
        opacity:0;
        transform:translateY(30px);
      }
      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    @keyframes floatText{
      0%,100%{
        transform:translateY(0px);
      }
      50%{
        transform:translateY(-8px);
      }
    }

    @media(max-width:768px){

      h1{
        font-size:2.5rem;
      }

      p{
        font-size:1rem;
      }

      .container{
        margin:20px;
        padding:30px 20px;
      }
    }

  </style>
</head>

<body>

  <div class="container">
    <h1>Welcome to Dream</h1>

    <p>
      Enter a surreal world where imagination bends reality,
      time melts away, and every thought becomes art.
    </p>

    <a href="#" class="btn">Explore Dreams</a>
  </div>

</body>
</html>
