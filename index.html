<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Flight Luggage Checklist</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(135deg, #0a1628 0%, #1a2e4a 50%, #0d1f35 100%);
  min-height: 100vh;
  color: #e8e8e8;
  padding: 20px;
}
.container { max-width: 860px; margin: 0 auto; }
header { text-align: center; padding: 24px 0 18px; }
header h1 { font-size: 1.9rem; color: #f0c040; letter-spacing: 2px; text-transform: uppercase; }
header p { color: #a0b4c8; margin-top: 6px; font-size: 0.92rem; }

.progress-card {
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(240,192,64,0.3);
  border-radius: 16px;
  padding: 22px 26px;
  margin-bottom: 20px;
}
.progress-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.progress-pct { font-size: 2rem; font-weight: 700; color: #f0c040; }
.remark {
  font-size: 0.92rem; font-weight: 600;
  padding: 6px 16px; border-radius: 20px;
  background: rgba(240,192,64,0.15); color: #f0c040;
  border: 1px solid rgba(240,192,64,0.4);
}
.progress-bar-bg { background: rgba(255,255,255,0.1); border-radius: 50px; height: 14px; overflow: hidden; }
.progress-bar-fill {
  height: 100%; border-radius: 50px;
  background: linear-gradient(90deg, #f0c040, #ffd700);
  transition: width 0.5s ease;
  box-shadow: 0 0 10px rgba(240,192,64,0.5);
  width: 0%;
}
.progress-counts { text-align: right; font-size: 0.8rem; color: #7a9ab8; margin-top: 6px; }

.btn-row { display: flex; gap: 12px; margin-bottom: 22px; flex-wrap: wrap; }
.btn {
  padding: 10px 20px; border-radius: 8px; border: none;
  cursor: pointer; font-weight: 600; font-size: 0.87rem;
  display: flex; align-items: center; gap: 8px;
  transition: transform 0.15s, box-shadow 0.15s;
}
.btn:hover { transform: translateY(-2px); box-shadow: 0 4px 15px rgba(0,0,0,0.35); }
.btn-excel { background: #1d6f42; color: #fff; }
.btn-pdf   { background: #c0392b; color: #fff; }
.btn-reset { background: rgba(255,255,255,0.08); color: #a0b4c8; border: 1px solid rgba(255,255,255,0.15); }

.category { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.09); border-radius: 14px; margin-bottom: 14px; overflow: hidden; }
.cat-header {
  display: flex; align-items: center; gap: 10px;
  padding: 13px 18px;
  background: rgba(240,192,64,0.07);
  border-bottom: 1px solid rgba(255,255,255,0.06);
  cursor: pointer; user-select: none;
}
.cat-icon { font-size: 1.2rem; }
.cat-title { font-size: 0.97rem; font-weight: 700; color: #f0c040; flex: 1; }
.cat-count { font-size: 0.78rem; color: #7a9ab8; margin-right: 6px; }
.cat-arrow { font-size: 0.7rem; color: #7a9ab8; transition: transform 0.3s; display: inline-block; }
.cat-arrow.open { transform: rotate(180deg); }

.items-list { display: block; }
.items-list.hidden { display: none; }

.item {
  display: flex; align-items: center; gap: 14px;
  padding: 10px 18px;
  border-bottom: 1px solid rgba(255,255,255,0.04);
  cursor: pointer; transition: background 0.2s;
}
.item:last-child { border-bottom: none; }
.item:hover { background: rgba(255,255,255,0.04); }

.custom-cb {
  width: 20px; height: 20px; min-width: 20px;
  border: 2px solid rgba(240,192,64,0.5);
  border-radius: 5px;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s;
  font-size: 0.75rem; font-weight: 900; color: transparent;
}
.item.checked .custom-cb { background: #f0c040; border-color: #f0c040; color: #0a1628; }
.item-label { font-size: 0.9rem; color: #cdd9e5; flex: 1; }
.item.checked .item-label { color: #4a6a5a; text-decoration: line-through; }
.item-note { font-size: 0.72rem; color: #546a80; margin-top: 2px; }

footer { text-align: center; padding: 22px 0 8px; color: #3a5a78; font-size: 0.76rem; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>✈ Flight Luggage Checklist</h1>
    <p>Pack smart. Travel stress-free.</p>
  </header>

  <div class="progress-card">
    <div class="progress-header">
      <div>
        <div class="progress-pct" id="pctText">0%</div>
        <div style="font-size:0.78rem;color:#7a9ab8;margin-top:2px;">Completed</div>
      </div>
      <div class="remark" id="remarkBox">🧳 Let's Start Packing!</div>
    </div>
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progressBar"></div>
    </div>
    <div class="progress-counts" id="countText">0 of 0 items checked</div>
  </div>

  <div class="btn-row">
    <button class="btn btn-excel" onclick="exportExcel()">📊 Export to Excel</button>
    <button class="btn btn-pdf"   onclick="exportPDF()">📄 Export to PDF</button>
    <button class="btn btn-reset" onclick="resetAll()">↺ Reset All</button>
  </div>

  <div id="checklist"></div>
  <footer>✈ Safe travels! Double-check before you zip up.</footer>
</div>

<script>
var categories = [
  {
    icon: '🪪', title: 'Travel Documents',
    items: [
      { label: 'Passport', note: 'Valid for 6+ months' },
      { label: 'Visa / e-Visa printout', note: 'If required for destination' },
      { label: 'Flight tickets (printed or digital)' },
      { label: 'Hotel booking confirmation' },
      { label: 'Travel insurance documents' },
      { label: 'National ID / Driving License' },
      { label: 'Emergency contact list' },
      { label: 'Foreign currency / Travel card' }
    ]
  },
  {
    icon: '👕', title: 'Clothing & Accessories',
    items: [
      { label: 'T-shirts / Tops', note: 'Based on trip duration' },
      { label: 'Trousers / Jeans' },
      { label: 'Formal wear', note: 'If meetings or events planned' },
      { label: 'Innerwear & Socks' },
      { label: 'Sleepwear / Pyjamas' },
      { label: 'Jacket / Sweater', note: 'For cold destinations or AC' },
      { label: 'Comfortable walking shoes' },
      { label: 'Sandals / Slippers' },
      { label: 'Belt & Watch' },
      { label: 'Sunglasses' }
    ]
  },
  {
    icon: '💻', title: 'Electronics & Gadgets',
    items: [
      { label: 'Mobile phone & charger' },
      { label: 'Laptop / Tablet & charger', note: 'Keep in carry-on' },
      { label: 'Universal power adapter' },
      { label: 'Power bank', note: 'Check airline watt-hour policy' },
      { label: 'Earphones / Headphones' },
      { label: 'Camera & memory cards' },
      { label: 'USB / data cables' },
      { label: 'Smart watch & charger' }
    ]
  },
  {
    icon: '🧴', title: 'Toiletries & Personal Care',
    items: [
      { label: 'Toothbrush & toothpaste', note: '100ml rule for carry-on' },
      { label: 'Shampoo & conditioner' },
      { label: 'Body wash / Soap' },
      { label: 'Deodorant / Perfume' },
      { label: 'Face wash & moisturiser' },
      { label: 'Sunscreen SPF 30+' },
      { label: 'Razor & shaving kit' },
      { label: 'Comb / Hairbrush' },
      { label: 'Makeup & remover', note: 'If applicable' },
      { label: 'Sanitary products', note: 'If applicable' },
      { label: 'Nail clipper & tweezers', note: 'In checked baggage only' }
    ]
  },
  {
    icon: '💊', title: 'Health & Medications',
    items: [
      { label: 'Prescription medicines', note: 'Carry enough for full trip' },
      { label: 'Painkiller (e.g. Paracetamol / Ibuprofen)' },
      { label: 'Antacid / Digestion tablets' },
      { label: 'Motion sickness pills' },
      { label: 'Band-aids & antiseptic cream' },
      { label: 'Hand sanitizer (100ml or less)' },
      { label: 'Face masks' },
      { label: 'Vitamin supplements' },
      { label: "Doctor's prescription copy", note: 'For controlled medications' }
    ]
  },
  {
    icon: '🎒', title: 'Carry-On Essentials',
    items: [
      { label: 'Neck pillow' },
      { label: 'Eye mask & ear plugs' },
      { label: 'Snacks for the flight' },
      { label: 'Empty refillable water bottle' },
      { label: 'Pen (for immigration / customs forms)' },
      { label: 'Book / E-reader / Magazine' },
      { label: 'Small lock for luggage' },
      { label: 'Luggage tags on all bags' },
      { label: 'Extra carry bag or tote bag' }
    ]
  }
];

var checked = {};

function buildChecklist() {
  var cl = document.getElementById('checklist');
  cl.innerHTML = '';
  for (var ci = 0; ci < categories.length; ci++) {
    var cat = categories[ci];
    var div = document.createElement('div');
    div.className = 'category';
    div.setAttribute('data-ci', ci);

    var header = document.createElement('div');
    header.className = 'cat-header';
    header.setAttribute('data-ci', ci);
    header.onclick = toggleCat;
    header.innerHTML =
      '<span class="cat-icon">' + cat.icon + '</span>' +
      '<span class="cat-title">' + cat.title + '</span>' +
      '<span class="cat-count" id="cc-' + ci + '">0/' + cat.items.length + '</span>' +
      '<span class="cat-arrow open" id="arr-' + ci + '">▼</span>';

    var list = document.createElement('div');
    list.className = 'items-list';
    list.id = 'list-' + ci;

    for (var ii = 0; ii < cat.items.length; ii++) {
      var item = cat.items[ii];
      var row = document.createElement('div');
      row.className = 'item';
      row.setAttribute('data-ci', ci);
      row.setAttribute('data-ii', ii);
      row.onclick = toggleItem;
      row.innerHTML =
        '<div class="custom-cb">✓</div>' +
        '<div style="flex:1">' +
          '<div class="item-label">' + item.label + '</div>' +
          (item.note ? '<div class="item-note">' + item.note + '</div>' : '') +
        '</div>';
      list.appendChild(row);
    }

    div.appendChild(header);
    div.appendChild(list);
    cl.appendChild(div);
  }
  updateProgress();
}

function toggleCat(e) {
  var ci = this.getAttribute('data-ci');
  var list = document.getElementById('list-' + ci);
  var arr  = document.getElementById('arr-' + ci);
  if (list.classList.contains('hidden')) {
    list.classList.remove('hidden');
    arr.classList.add('open');
  } else {
    list.classList.add('hidden');
    arr.classList.remove('open');
  }
}

function toggleItem(e) {
  var ci = this.getAttribute('data-ci');
  var ii = this.getAttribute('data-ii');
  var key = ci + '-' + ii;
  checked[key] = !checked[key];
  if (checked[key]) {
    this.classList.add('checked');
  } else {
    this.classList.remove('checked');
  }
  updateCatCount(parseInt(ci));
  updateProgress();
}

function updateCatCount(ci) {
  var cat = categories[ci];
  var done = 0;
  for (var ii = 0; ii < cat.items.length; ii++) {
    if (checked[ci + '-' + ii]) done++;
  }
  var el = document.getElementById('cc-' + ci);
  if (el) el.textContent = done + '/' + cat.items.length;
}

function updateProgress() {
  var total = 0, done = 0;
  for (var ci = 0; ci < categories.length; ci++) {
    total += categories[ci].items.length;
    for (var ii = 0; ii < categories[ci].items.length; ii++) {
      if (checked[ci + '-' + ii]) done++;
    }
  }
  var pct = total ? Math.round((done / total) * 100) : 0;
  document.getElementById('progressBar').style.width = pct + '%';
  document.getElementById('pctText').textContent = pct + '%';
  document.getElementById('countText').textContent = done + ' of ' + total + ' items checked';

  var remarks = [
    { min: 0,   max: 0,   text: "🧳 Let's Start Packing!" },
    { min: 1,   max: 24,  text: "📦 Getting Started..." },
    { min: 25,  max: 49,  text: "🔄 Making Progress!" },
    { min: 50,  max: 74,  text: "💪 Halfway There!" },
    { min: 75,  max: 89,  text: "🌟 Almost Ready!" },
    { min: 90,  max: 99,  text: "✅ Final Checks..." },
    { min: 100, max: 100, text: "🎉 All Set! Good to Go! ✈️" }
  ];
  for (var i = 0; i < remarks.length; i++) {
    if (pct >= remarks[i].min && pct <= remarks[i].max) {
      document.getElementById('remarkBox').textContent = remarks[i].text;
      break;
    }
  }
}

function resetAll() {
  if (confirm('Reset all checkboxes?')) {
    checked = {};
    buildChecklist();
  }
}

function exportExcel() {
  var rows = [['Category', 'Item', 'Note', 'Status']];
  for (var ci = 0; ci < categories.length; ci++) {
    var cat = categories[ci];
    for (var ii = 0; ii < cat.items.length; ii++) {
      rows.push([
        cat.title,
        cat.items[ii].label,
        cat.items[ii].note || '',
        checked[ci + '-' + ii] ? 'Done' : 'Pending'
      ]);
    }
  }
  var wb = XLSX.utils.book_new();
  var ws = XLSX.utils.aoa_to_sheet(rows);
  ws['!cols'] = [{wch:25},{wch:38},{wch:30},{wch:12}];
  XLSX.utils.book_append_sheet(wb, ws, 'Checklist');
  XLSX.writeFile(wb, 'Flight_Luggage_Checklist.xlsx');
}

function exportPDF() {
  var jsPDF = window.jspdf.jsPDF;
  var doc = new jsPDF({ unit: 'mm', format: 'a4' });

  var total = 0, done = 0;
  for (var ci = 0; ci < categories.length; ci++) {
    total += categories[ci].items.length;
    for (var ii = 0; ii < categories[ci].items.length; ii++) {
      if (checked[ci + '-' + ii]) done++;
    }
  }
  var pct = total ? Math.round((done / total) * 100) : 0;

  doc.setFillColor(10, 22, 40);
  doc.rect(0, 0, 210, 297, 'F');
  doc.setFillColor(26, 46, 74);
  doc.rect(0, 0, 210, 36, 'F');
  doc.setTextColor(240, 192, 64);
  doc.setFontSize(18);
  doc.setFont('helvetica', 'bold');
  doc.text('FLIGHT LUGGAGE CHECKLIST', 105, 15, { align: 'center' });
  doc.setFontSize(9);
  doc.setTextColor(160, 180, 200);
  doc.setFont('helvetica', 'normal');
  doc.text('Progress: ' + pct + '%  |  ' + done + ' of ' + total + ' items packed', 105, 24, { align: 'center' });
  doc.text('Generated: ' + new Date().toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' }), 105, 31, { align: 'center' });

  var y = 44;
  for (var ci = 0; ci < categories.length; ci++) {
    var cat = categories[ci];
    if (y > 265) { doc.addPage(); doc.setFillColor(10,22,40); doc.rect(0,0,210,297,'F'); y = 16; }
    doc.setFillColor(30, 55, 90);
    doc.roundedRect(12, y, 186, 9, 2, 2, 'F');
    doc.setTextColor(240, 192, 64);
    doc.setFontSize(10);
    doc.setFont('helvetica', 'bold');
    doc.text(cat.title.toUpperCase(), 17, y + 6.3);
    y += 12;

    for (var ii = 0; ii < cat.items.length; ii++) {
      if (y > 272) { doc.addPage(); doc.setFillColor(10,22,40); doc.rect(0,0,210,297,'F'); y = 16; }
      var isDone = checked[ci + '-' + ii];
      doc.setFillColor(isDone ? 20 : 16, isDone ? 50 : 30, isDone ? 35 : 48);
      doc.roundedRect(14, y, 182, 7.5, 1.5, 1.5, 'F');
      doc.setTextColor(isDone ? 80 : 200, isDone ? 140 : 210, isDone ? 100 : 230);
      doc.setFontSize(8.5);
      doc.setFont('helvetica', 'normal');
      var mark = isDone ? '[DONE]' : '[  ]';
      var noteStr = cat.items[ii].note ? '  (' + cat.items[ii].note + ')' : '';
      doc.text(mark + '  ' + cat.items[ii].label + noteStr, 18, y + 5);
      y += 9;
    }
    y += 4;
  }

  doc.save('Flight_Luggage_Checklist.pdf');
}

window.onload = function() {
  buildChecklist();
};
</script>
</body>
</html>
